[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inflight-py"
version = "1.0.0"
description = "Deduplicate concurrent requests by query_key"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["dedup", "inflight", "concurrent", "request", "query", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/user/inflight-py"
Issues = "https://github.com/user/inflight-py/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
bench = ["asyncpg", "valkey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["inflight"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): v{version}"
